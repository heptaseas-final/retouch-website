<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Retouch app icon">
  <title>Retouch</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C06489"/>
      <stop offset="0.45" stop-color="#C77C9C"/>
      <stop offset="1" stop-color="#EBD3DD"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F6E3EB"/>
      <stop offset="0.5" stop-color="#FBF2F6"/>
      <stop offset="1" stop-color="#E7CBD8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#plate)"/>

  <!-- mirror stand -->
  <path d="M134 206v108a52 52 0 0 0 52 52h140a52 52 0 0 0 52-52V206"
        fill="none" stroke="#FBEFF4" stroke-width="30" stroke-linecap="round"/>
  <path d="M256 366v28" stroke="#FBEFF4" stroke-width="30" stroke-linecap="round"/>
  <rect x="176" y="398" width="160" height="34" rx="17" fill="#F2DCE5"/>

  <!-- mirror glass -->
  <rect x="152" y="112" width="208" height="208" rx="56" fill="#FBEFF4"/>
  <rect x="168" y="128" width="176" height="176" rx="44" fill="url(#glass)" stroke="#C99BB0" stroke-width="5"/>
  <rect x="168" y="128" width="176" height="176" rx="44" fill="url(#gloss)"/>

  <!-- sparkles -->
  <path d="M396 92c4 30 10 36 40 40-30 4-36 10-40 40-4-30-10-36-40-40 30-4 36-10 40-40z" fill="#FBEFF4"/>
  <path d="M438 168c2.5 18 6 22 24 24-18 2.5-21.5 6-24 24-2.5-18-6-21.5-24-24 18-2 21.5-6 24-24z" fill="#FBEFF4"/>
