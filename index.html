<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF2F4" />

    <title>Re-touch, a real mirror on your phone</title>
    <meta
      name="description"
      content="An ergonomic beauty mirror for on-the-go makeup, with gesture zoom, auto lighting, and no beauty filter, so your blush never goes invisible again."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      The absolute URLs below point at the Vercel deployment. If a custom
      domain is registered later, replace them here and in src/config.ts, and
      add the Sitemap line to public/robots.txt with a regenerated
      public/sitemap.xml, which is still outstanding.

      Open Graph tags are static. This is a client-rendered single page app, so
      social scrapers only ever see this file and these values describe the
      landing page for every route.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Re-touch" />
    <meta property="og:title" content="Turn your phone into a real mirror with Re-touch." />
    <meta
      property="og:description"
      content="An ergonomic beauty mirror for on-the-go makeup, with gesture zoom, auto lighting, and no beauty filter."
    />
    <meta property="og:url" content="https://retouch-mirror.vercel.app/" />
    <meta property="og:image" content="https://retouch-mirror.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Re-touch app icon beside the words Turn your phone into a real mirror." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
