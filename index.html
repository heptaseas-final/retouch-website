<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF8FA" />

    <title>Retouch, a real mirror on your phone</title>
    <meta
      name="description"
      content="An ergonomic beauty mirror for on-the-go makeup, with gesture zoom, auto lighting, and true-to-eye shades, so your blush never goes invisible again."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      TODO(owner): no domain is confirmed yet, so every absolute URL below
      carries the DOMAIN_NOT_SET token. Grep for it before deploying, replace
      it here and in src/config.ts, and regenerate public/sitemap.xml.

      Open Graph tags are static. This is a client-rendered single page app, so
      social scrapers only ever see this file and these values describe the
      landing page for every route.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Retouch" />
    <meta property="og:title" content="Turn your phone into a real mirror with Retouch." />
    <meta
      property="og:description"
      content="An ergonomic beauty mirror for on-the-go makeup, with gesture zoom, auto lighting, and true-to-eye shades."
    />
    <meta property="og:url" content="https://DOMAIN_NOT_SET/" />
    <meta property="og:image" content="https://DOMAIN_NOT_SET/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Retouch app icon beside the words Turn your phone into a real mirror." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
